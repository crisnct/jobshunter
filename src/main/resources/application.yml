server:
  port: 8081

jobshunter:
  expiredKeywords: expired,no longer exists,This job was available
  iterationPerUser: 5
  iterationDelay: 30000

  scheduler:
    frequency: 3600000

  whatsapp:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_WHATSAPP_FROM:}
    to-number: ${TWILIO_WHATSAPP_TO:}

  chatGpt:
    apiKey: ${CHATGPT5_API_KEY:}
    model: "gpt-5.1"
    temperature: 0
    maxTokens: 2000
    toolsType: "web_search"
    systemPrompt: "Follow the user's instructions carefully and prioritize delivering relevant job URLs; ensure URLs are valid and meet the filters from the user prompt; avoid explanations and extra text beyond the required output format; do not fabricate URLs, but feel free to return all real matches you find.Exclude from response the URL's from following platforms: weworkremotley.com, dailyremote.com, upwork.com, lucrezi.ro. It's a must to provide omly URL's separated by empty space and not on different lines."

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/jobshunter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${LIQUIBASE_ENABLED:true}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-secret-please-keep-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.jobshunter: DEBUG
