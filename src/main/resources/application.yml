server:
  port: 8081

jobshunter:
  prompt: "I'm Mid-level Java Developer (backend) with 5 years of experience in Java and Spring Boot; no frontend knowledge; looking for a Java-only role, any country, contractor/B2B, full remote from Romania, no travelling, job description must not contain 'Job expired', 'Hybrid', 'full-stack' or 'fullstack'; send me the best 20 matching jobs with full URLs, maximum 2 from each platform, skipping LinkedIn and WeWorkRemotely."
  cv-path: "cristian-tone-java-dev.pdf"
  scheduler:
    cron: "0 0 9 * * *"
  whatsapp:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_WHATSAPP_FROM:}
    to-number: ${TWILIO_WHATSAPP_TO:}

logging:
  level:
    root: INFO
    com.jobshunter: DEBUG
