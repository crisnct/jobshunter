openapi: 3.0.3
info:
  title: JobsHunter API
  version: "1.0.0"
  description: |
    HTTP API for user authentication, job search, profile management, CV upload, and admin email tools.
servers:
  - url: https://ronin-archesporial-lonnie.ngrok-free.dev
    description: Prod
  - url: http://localhost:8081
    description: Local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
      required: [token]

    RegistrationResponse:
      type: object
      properties:
        message:
          type: string
        verificationToken:
          type: string
      required: [message, verificationToken]

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255
        phoneNumber:
          type: string
          maxLength: 30
      required: [username, email, password, phoneNumber]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    ChangePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [oldPassword, newPassword]

    EngineType:
      type: string
      enum: [GPT, GEMINI, SERP]

    EngineTier:
      type: string
      enum: [ECONOMY, PREMIUM]

    EngineSelection:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EngineType'
        tier:
          $ref: '#/components/schemas/EngineTier'
      required: [type, tier]

    SearchJobsRequest:
      type: object
      properties:
        username:
          type: string
        iterations:
          type: integer
          format: int32
          minimum: 1
          description: Number of search iterations to perform.
        engines:
          type: array
          items:
            $ref: '#/components/schemas/EngineSelection'
      required: [username, iterations, engines]

    JobSearchRequest:
      type: object
      properties:
        prompt:
          type: string
          description: User-defined search prompt.
      required: [prompt]

    Job:
      type: object
      properties:
        score:
          type: integer
          format: int32
        url:
          type: string
          format: uri
      required: [score, url]

    JobHuntResponse:
      type: object
      properties:
        jobsFound:
          type: array
          items:
            $ref: '#/components/schemas/Job'
      required: [jobsFound]

    UserInfoResponse:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        notifyWhatsapp:
          type: boolean
        notifyEmail:
          type: boolean
        emailVerified:
          type: boolean
        verificationToken:
          type: string
          nullable: true
        gptFileId:
          type: string
          nullable: true
        geminiFileId:
          type: string
          nullable: true
        lastJobs:
          type: string
          nullable: true
          description: ISO-8601 date-time as string.
        timeInterval:
          type: integer
          format: int32
          nullable: true
        prompts:
          type: array
          nullable: true
          items:
            type: string
        createdAt:
          type: string
          nullable: true
          description: ISO-8601 date-time as string.
        roles:
          type: array
          items:
            type: string
      required:
        - username
        - email
        - phoneNumber
        - notifyWhatsapp
        - notifyEmail
        - emailVerified
        - roles

    UserJobResponse:
      type: object
      properties:
        jobUrl:
          type: string
          format: uri
        createdAt:
          type: string
          description: ISO-8601 date-time as string.
      required: [jobUrl, createdAt]

    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        subject:
          type: string
          nullable: true
          maxLength: 255
        message:
          type: string
        file:
          type: string
          format: binary
          nullable: true
      required: [email, message]

    UploadCvResponse:
      type: object
      properties:
        message:
          type: string
        fileId:
          type: string
      required: [message, fileId]

    SerpPrompt:
      type: object
      properties:
        q:
          type: string
          maxLength: 2000
          description: SERP query.
        google_domain:
          type: string
          maxLength: 255
          description: Google domain (e.g., google.ro). See https://serpapi.com/google-domains
        date_posted:
          type: string
          maxLength: 128
          description: Date filter (today, last_3_days, last_7_days, last_14_days, last_30_days).
        gl:
          type: string
          maxLength: 2
          description: Country code. See https://serpapi.com/google-countries
        location:
          type: string
        workType:
          type: string
          enum: [REMOTE, ONSITE, HYBRID]
        radius:
          type: integer
          format: int32
          description: Radius in km.
        hl:
          type: string
          maxLength: 2
          description: Language code. See https://serpapi.com/google-languages
        engine_tier:
          $ref: '#/components/schemas/EngineTier'
      required: [q, engine_tier]

    AiPrompt:
      type: object
      properties:
        prompt:
          type: string
          maxLength: 3000
        engine_type:
          $ref: '#/components/schemas/EngineType'
        engine_tier:
          $ref: '#/components/schemas/EngineTier'
      required: [prompt, engine_type, engine_tier]

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        phone_number:
          type: string
          maxLength: 30
        time_interval:
          type: integer
          format: int32
          minimum: 1
        notify_whatsapp:
          type: boolean
        notify_email:
          type: boolean
        serp_prompts:
          type: array
          items:
            $ref: '#/components/schemas/SerpPrompt'
        ai_prompts:
          type: array
          items:
            $ref: '#/components/schemas/AiPrompt'
      required:
        - username
        - phone_number
        - time_interval

    JobHit:
      type: object
      properties:
        title:
          type: string
        company:
          type: string
        location:
          type: string
        shareLink:
          type: string
          format: uri
        jobId:
          type: string
        applyLinks:
          type: array
          items:
            type: string
            format: uri
      required: [title, company, location, shareLink, jobId, applyLinks]

    FilterLink:
      type: object
      properties:
        name:
          type: string
        link:
          type: string
          format: uri
        serpapiLink:
          type: string
          format: uri
      required: [name, link, serpapiLink]

    ParseResult:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the API call was successful
        empty:
          type: boolean
          description: Whether the results are empty
        jobsState:
          type: string
          nullable: true
          description: State of job results from search_information
        error:
          type: string
          nullable: true
          description: Error message if any
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobHit'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterLink'
      required: [ok, empty, jobs, filters]

paths:
  /api/user/delete:
    delete:
      summary: Delete the authenticated user's account
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/user/approve:
    patch:
      summary: Approve user by username (admin only)
      tags: [User]
      description: Requires ROLE_ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or already approved user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered and verification token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: Obtain JWT token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/verify:
    patch:
      summary: Verify user email by token
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/me:
    get:
      summary: Get current authenticated user profile
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/search:
    post:
      summary: Run job search for authenticated user
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchJobsRequest'
      responses:
        '200':
          description: Jobs found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHuntResponse'
        '404':
          description: No jobs found.
        '400':
          description: Bad request (missing user or invalid payload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/all:
    get:
      summary: List all users (admin only)
      tags: [User]
      description: Requires ROLE_ADMIN.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/jobs:
    get:
      summary: Get jobs found for a user (admin only)
      tags: [User]
      description: Requires ROLE_ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User jobs list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserJobResponse'
        '400':
          description: Missing or invalid username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/update:
    put:
      summary: Update user profile, notification flags, and prompts
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/password:
    patch:
      summary: Change password for authenticated user
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; verification token sent by email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cv/upload:
    post:
      summary: Upload user CV to ChatGPT
      tags: [CV]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: CV uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCvResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cv:
    delete:
      summary: Delete user CV
      tags: [CV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CV deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/test/email/send:
    post:
      summary: Send custom email (admin only)
      tags: [Admin Test]
      description: Requires ROLE_ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Email sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/test/email/sendUsingTemplate:
    post:
      summary: Send templated job email (admin only)
      tags: [Admin Test]
      description: Requires ROLE_ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobHuntResponse'
      responses:
        '200':
          description: Email sent using template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/test/searchWithSerp:
    post:
      summary: Search jobs using SerpAPI (test role only)
      tags: [Test]
      description: Requires ROLE_TEST. Searches for jobs using SerpAPI. Returns ParseResult with jobs if found, or error response if jobs list is empty.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchWithSerpRequest'
      responses:
        '200':
          description: Jobs found successfully. Returns ParseResult with jobs array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResult'
        '400':
          description: No jobs found (jobs array is empty). Returns error message from ParseResult.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - requires ROLE_TEST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /actuator/health:
    get:
      summary: Health check
      tags: [Actuator]
      responses:
        '200':
          description: Application is healthy.

  /actuator/info:
    get:
      summary: Application info
      tags: [Actuator]
      responses:
        '200':
          description: Basic application information.
