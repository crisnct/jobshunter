openapi: 3.0.3
info:
  title: JobsHunter API
  version: "1.0.0"
  description: |
    HTTP API for user authentication, job search, profile management, CV upload, and admin email tools.
servers:
  - url: https://ronin-archesporial-lonnie.ngrok-free.dev
    description: Prod
  - url: http://localhost:8081
    description: Local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [ message ]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [ error ]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
      required: [ token ]

    RegistrationResponse:
      type: object
      properties:
        message:
          type: string
        verificationToken:
          type: string
      required: [ message, verificationToken ]

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255
        phoneNumber:
          type: string
          maxLength: 30
      required: [ username, email, password, phoneNumber ]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [ username, password ]

    ChangePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [ oldPassword, newPassword ]

    EngineType:
      type: string
      enum: [ GPT, GROK, GEMINI, SERP ]

    EngineSelection:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EngineType'
      required: [ type ]

    SearchJobsRequest:
      type: object
      properties:
        username:
          type: string
        iterations:
          type: integer
          format: int32
          minimum: 1
          description: Number of search iterations to perform.
        engines:
          type: array
          items:
            $ref: '#/components/schemas/EngineSelection'
      required: [ username, iterations, engines ]

    JobSearchRequest:
      type: object
      properties:
        prompt:
          type: string
          description: User-defined search prompt.
      required: [ prompt ]

    Job:
      type: object
      properties:
        score:
          type: integer
          format: int32
        url:
          type: string
          format: uri
      required: [ score, url ]

    JobHuntResponse:
      type: object
      properties:
        jobsFound:
          type: array
          items:
            $ref: '#/components/schemas/Job'
      required: [ jobsFound ]

    UserInfoResponse:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        notifyWhatsapp:
          type: boolean
        notifyEmail:
          type: boolean
        emailVerified:
          type: boolean
        verificationToken:
          type: string
          nullable: true
        cvFilename:
          type: string
          nullable: true
        lastJobs:
          type: string
          nullable: true
          description: ISO-8601 date-time as string.
        prompts:
          type: array
          nullable: true
          items:
            type: string
        createdAt:
          type: string
          nullable: true
          description: ISO-8601 date-time as string.
        roles:
          type: array
          items:
            type: string
        city:
          type: string
          nullable: true
          maxLength: 64
        country:
          type: string
          nullable: true
          maxLength: 64
        jobDomain:
          type: string
          nullable: true
          maxLength: 64
        jobRoles:
          type: array
          nullable: true
          items:
            type: string
        jobTypes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/JobType'
        relocation:
          $ref: '#/components/schemas/Relocation'
          nullable: true
        contractTypes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContractType'
      required:
        - username
        - email
        - phoneNumber
        - notifyWhatsapp
        - notifyEmail
        - emailVerified
        - roles

    UserJobResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
        createdAt:
          type: string
          description: ISO-8601 date-time as string.
      required: [ url, createdAt ]

    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        subject:
          type: string
          nullable: true
          maxLength: 255
        message:
          type: string
        file:
          type: string
          format: binary
          nullable: true
      required: [ email, message ]

    UploadCvResponse:
      type: object
      properties:
        message:
          type: string
        fileId:
          type: string
      required: [ message, fileId ]

    SerpPrompt:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Prompt ID for updates (null for new prompts)
        q:
          type: string
          maxLength: 2000
          description: SERP query.
        google_domain:
          type: string
          maxLength: 255
          nullable: true
          description: Google domain (e.g., google.ro). See https://serpapi.com/google-domains
        date_posted:
          type: string
          maxLength: 128
          nullable: true
          description: Date filter (today, last_3_days, last_7_days, last_14_days, last_30_days).
        gl:
          type: string
          maxLength: 2
          nullable: true
          description: Country code. See https://serpapi.com/google-countries
        location:
          type: string
          nullable: true
        workType:
          type: string
          enum: [ REMOTE, ONSITE, HYBRID ]
          nullable: true
        radius:
          type: integer
          format: int32
          nullable: true
          description: Radius in km.
        hl:
          type: string
          maxLength: 2
          nullable: true
          description: Language code. See https://serpapi.com/google-languages
      required: [ q ]

    SerpPromptUpdate:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Prompt ID for updates (null for new prompts)
        q:
          type: string
          maxLength: 2000
          description: SERP query.
        googleDomain:
          type: string
          maxLength: 255
          nullable: true
          description: Google domain (e.g., google.ro). See https://serpapi.com/google-domains
        datePosted:
          type: string
          maxLength: 128
          nullable: true
          description: Date filter (today, last_3_days, last_7_days, last_14_days, last_30_days).
        country:
          type: string
          maxLength: 2
          nullable: true
          description: Country code. See https://serpapi.com/google-countries
        location:
          type: string
          nullable: true
        workType:
          type: string
          enum: [ REMOTE, ONSITE, HYBRID ]
          nullable: true
        radius:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: Radius in km.
        language:
          type: string
          maxLength: 2
          nullable: true
          description: Language code. See https://serpapi.com/google-languages
      required: [ q ]

    AiPrompt:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Prompt ID for updates (null for new prompts)
        prompt:
          type: string
          maxLength: 3000
        engine:
          $ref: '#/components/schemas/EngineType'
        model:
          type: string
          maxLength: 255
          description: Model name (e.g., gpt-4o-mini, gemini-2.5-flash)
      required: [ prompt, engine, model ]

    AiPromptUpdate:
      type: object
      properties:
        prompt:
          type: string
          maxLength: 3000
      required: [ prompt ]

    JobType:
      type: string
      enum: [ REMOTE, HYBRID, ONSITE ]

    ContractType:
      type: string
      enum: [ EMPLOYMENT, B2B, EOR, INTERNSHIP ]

    Relocation:
      type: string
      enum: [ NO, YES_BUT_WITHIN_COUNTRY, YES ]

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        phoneNumber:
          type: string
          maxLength: 30
        notifyWhatsapp:
          type: boolean
        notifyEmail:
          type: boolean
        serpPrompts:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SerpPromptUpdate'
        aiPrompts:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AiPromptUpdate'
        city:
          type: string
          nullable: true
          maxLength: 64
        country:
          type: string
          nullable: true
          maxLength: 64
        jobDomain:
          type: string
          nullable: true
          maxLength: 64
        jobRoles:
          type: array
          nullable: true
          items:
            type: string
        jobTypes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/JobType'
        relocation:
          $ref: '#/components/schemas/Relocation'
          nullable: true
        contractTypes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContractType'
      required:
        - username
        - phoneNumber

    JobHit:
      type: object
      properties:
        title:
          type: string
        company:
          type: string
        location:
          type: string
        shareLink:
          type: string
          format: uri
        jobId:
          type: string
        applyLinks:
          type: array
          items:
            type: string
            format: uri
      required: [ title, company, location, shareLink, jobId, applyLinks ]

    FilterLink:
      type: object
      properties:
        name:
          type: string
        link:
          type: string
          format: uri
        serpapiLink:
          type: string
          format: uri
      required: [ name, link, serpapiLink ]

    SearchWithSerpRequest:
      type: object
      properties:
        q:
          type: string
          maxLength: 2000
          description: SERP query
        google_domain:
          type: string
          maxLength: 255
          nullable: true
          description: Google domain (e.g., google.ro). See https://serpapi.com/google-domains
        date_posted:
          type: string
          maxLength: 128
          nullable: true
          description: Date filter (today, last_3_days, last_7_days, last_14_days, last_30_days)
        gl:
          type: string
          maxLength: 2
          nullable: true
          description: Country code. See https://serpapi.com/google-countries
        location:
          type: string
          nullable: true
        workType:
          type: string
          enum: [ REMOTE, ONSITE, HYBRID ]
          nullable: true
        radius:
          type: integer
          format: int32
          nullable: true
          description: Radius in km
        hl:
          type: string
          maxLength: 2
          nullable: true
          description: Language code. See https://serpapi.com/google-languages
      required: [ q ]

    AiModel:
      type: object
      properties:
        model:
          type: string
          description: Model name
        enabled:
          type: boolean
          description: Whether the model is enabled
        notes:
          type: string
          nullable: true
          description: Additional notes about the model
      required: [ model, enabled ]

    JobOrderRequest:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/EngineType'
          description: AI provider type (GPT, GROK, GEMINI, SERP)
        model:
          type: string
          description: Model name (e.g., gpt-4o-mini, gemini-2.5-flash)
        searchCompanies:
          type: boolean
          description: Whether to search for companies
        searchWithUserPrompts:
          type: boolean
          description: Whether to use user prompts for the search
      required: [ provider, model, searchCompanies, searchWithUserPrompts ]

    JobOrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Job order ID
        engineConfigurationId:
          type: integer
          format: int64
          description: AI model configuration ID
        provider:
          type: string
          description: AI provider type (GPT, GEMINI, GROK, SERP)
        model:
          type: string
          description: Model name
        searchCompanies:
          type: boolean
          description: Whether to search for companies
        searchByPrompts:
          type: boolean
          description: Whether to search using user prompts
        status:
          $ref: '#/components/schemas/OrderStatus'
        notified:
          type: boolean
          description: Whether the user has been notified
        modifiedAt:
          type: string
          format: date-time
          description: Order last modification timestamp
        jobsFound:
          type: integer
          format: int64
          description: Number of jobs found for the order
        errorMessage:
          type: string
          nullable: true
          description: Error message if the order failed
      required: [ id, engineConfigurationId, provider, model, searchCompanies, searchByPrompts, status, notified, modifiedAt, jobsFound ]

    OrderStatus:
      type: string
      enum: [ NEW, PROCESSING, COMPLETED, FAILED, CANCELED ]
      description: Status of the job order

    ParseResult:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the API call was successful
        empty:
          type: boolean
          description: Whether the results are empty
        jobsState:
          type: string
          nullable: true
          description: State of job results from search_information
        error:
          type: string
          nullable: true
          description: Error message if any
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobHit'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterLink'
      required: [ ok, empty, jobs, filters ]

paths:
  /api/user/delete:
    delete:
      summary: Delete the authenticated user's account
      tags: [ User ]
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Account deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/user/approve:
    patch:
      summary: Approve user by username (admin only)
      tags: [ User ]
      description: Requires ROLE_ADMIN.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
        - in: query
          name: rejectReason
          required: false
          schema:
            type: string
            maxLength: 255
          description: Optional rejection reason. If provided, sends rejection email instead of approval.
      responses:
        '200':
          description: User approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or already approved user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not test role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered and verification token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: Obtain JWT access token and refresh token
      tags: [ Auth ]
      description: Returns access token in response body. Refresh token is set as HttpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded. Access token in response, refresh token in HttpOnly cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      summary: Refresh access token using refresh token
      tags: [ Auth ]
      description: Validates refresh token from HttpOnly cookie, rotates it, and returns new access token. New refresh token is set as HttpOnly cookie.
      responses:
        '200':
          description: Tokens refreshed successfully. New access token in response, new refresh token in HttpOnly cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid, expired, or revoked refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      summary: Logout current session
      tags: [ Auth ]
      description: Revokes current session and expires refresh token cookie. Requires authentication.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Logout successful. Session revoked and cookies expired.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout-all:
    post:
      summary: Logout all sessions for authenticated user (admin only)
      tags: [ Auth ]
      description: Revokes all active sessions for the authenticated user and expires refresh token cookie. Requires ROLE_ADMIN.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: All sessions revoked successfully. Cookies expired.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (requires ROLE_ADMIN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/verify:
    patch:
      summary: Verify user email by token
      tags: [ Auth ]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/csrf-token:
    get:
      summary: Get CSRF token
      tags: [ Auth ]
      description: Retrieves the CSRF token required for secure API requests
      responses:
        '200':
          description: CSRF token retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  headerName:
                    type: string
                  parameterName:
                    type: string
                required: [ token, headerName, parameterName ]

  /api/user/me:
    get:
      summary: Get current authenticated user profile
      tags: [ User ]
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Current user info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/all:
    get:
      summary: List all users (admin only)
      tags: [ User ]
      description: Requires ROLE_ADMIN.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Users list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not test role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/jobs:
    get:
      summary: Get jobs found for a user (admin only)
      tags: [ User ]
      description: Requires ROLE_ADMIN.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User jobs list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserJobResponse'
        '400':
          description: Missing or invalid username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not test role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/update:
    put:
      summary: Update user profile, notification flags, and prompts
      tags: [ User ]
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                    description: Updated username
                  message:
                    type: string
                    description: Success message
                required: [ user, message ]
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/password:
    patch:
      summary: Change password for authenticated user
      tags: [ User ]
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; verification token sent by email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cv/upload:
    post:
      summary: Upload user CV to ChatGPT
      tags: [ CV ]
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [ file ]
      responses:
        '200':
          description: CV uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCvResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cv:
    delete:
      summary: Delete user CV
      tags: [ CV ]
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: CV deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/test/email/send:
    post:
      summary: Send custom email (test role only)
      tags: [ Test ]
      description: Requires ROLE_TEST.
      security:
