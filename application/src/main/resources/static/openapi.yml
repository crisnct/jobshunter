  /api/engine/models:
    get:
      summary: Get all engine models grouped by engine
      tags: [ Engine ]
      description: Returns a map where keys are engine types and values are lists of available models for each engine. Requires authentication.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Map of engines to their available models
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/AiModel'
                example:
                  GPT:
                    - model: gpt-4o-mini
                      enabled: true
                      notes: null
                    - model: gpt-5.2
                      enabled: true
                      notes: null
                  GEMINI:
                    - model: gemini-2.5-flash
                      enabled: true
                      notes: null
                    - model: gemini-2.5-pro
                      enabled: true
                      notes: null
                  SERP:
                    - model: google_jobs
                      enabled: true
                      notes: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/engine/order:
    post:
      summary: Create new job orders
      tags: [ Engine ]
      description: Creates one or more job orders for the authenticated user with the specified engine configurations. Requires authentication. At least one of searchCompanies or searchWithUserPrompts must be true for each order.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JobOrderRequest'
      responses:
        '201':
          description: Job orders created successfully
          content:
            application/json:
              schema:
                type: string
                example: "Job orders created successfully"
        '400':
          description: Invalid request (e.g., engine configuration not found, or both searchCompanies and searchWithUserPrompts are false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
