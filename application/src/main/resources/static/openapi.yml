          name: fileId
          required: true
          schema:
            type: string
          description: File ID for context
        - in: query
          name: city
          required: true
          schema:
            type: string
          description: City for search context
        - in: query
          name: country
          required: true
          schema:
            type: string
          description: Country for search context
      requestBody:
        required: true
        content:
          application/json:
            schema:
