  /api/test/score:
    post:
      summary: Compute job score (test role only)
      tags: [ Test ]
      description: Requires ROLE_TEST. Computes a compatibility score between a job URL and the authenticated user's CV using the specified AI engine and model.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobUrl:
                  type: string
                  maxLength: 2048
                  description: URL of the job posting to score
                engineProvider:
                  type: string
                  description: AI engine provider (GPT, GEMINI, or GROK)
                  enum: [ GPT, GEMINI, GROK ]
                engineModel:
                  type: string
                  description: Model name to use for scoring
              required: [ jobUrl, engineProvider, engineModel ]
      responses:
        '200':
          description: Job score computed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
                    format: int32
                    description: Compatibility score between 0 and 100
                required: [ score ]
        '400':
          description: Bad request (e.g., invalid URL, model not found, user has no CV, failed to fetch/extract job description)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - requires ROLE_TEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

