<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JobsHunter UI</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom styles for aesthetic appeal and responsiveness */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    #root {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .title {
      font-size: 2.25rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 0;
    }

    /* Updated logo styles */
    .logo {
      max-width: 256px; /* Set max width as requested */
      width: 100%; /* Make it responsive */
      height: auto; /* Maintain aspect ratio */
      margin-bottom: 1rem;
      display: block;
      /* Placeholder styles for background and border-radius removed */
    }

    .card {
      background-color: white;
      padding: 1.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
    }

    .form-card h2, .profile-card h2 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 1rem;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 0.5rem;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field span {
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 0.25rem;
    }

    input {
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    button {
      background-color: #4f46e5;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background-color: #4338ca;
    }

    button:active {
      transform: scale(0.99);
    }

    .status {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #6b7280;
      text-align: center;
    }

    /* Profile Specific Styles */
    .profile-card {
      text-align: left;
      border-left: 5px solid #10b981; /* Green accent */
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 1.5rem;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 0.75rem;
      align-items: start;
      padding: 0.5rem 0;
      border-bottom: 1px dashed #e5e7eb;
      width: 100%;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-key {
      font-weight: 600;
      color: #111827;
      text-transform: capitalize;
    }

    .detail-value {
      color: #374151;
      word-break: break-word;
    }

    .nested {
      padding-left: 0.5rem;
      border-left: 2px solid #e5e7eb;
      margin-left: 0.25rem;
    }

    .nested-fields {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .text-muted {
      color: #9ca3af;
      font-style: italic;
    }

    .json-card {
      width: 100%;
      margin-top: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      overflow: hidden;
      background: #f9fafb;
    }

    .json-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: #111827;
      color: white;
    }

    .json-card__badge {
      background: #22c55e;
      color: #064e3b;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .json-card__body {
      margin: 0;
      padding: 1rem;
      background: #0b1621;
      color: #d1d5db;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .badge {
      background: #d1fae5;
      color: #059669;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85em;
      font-weight: 600;
    }

    .logout-button {
      background-color: #ef4444;
      width: 100%;
    }

    .logout-button:hover {
      background-color: #dc2626;
    }

  </style>
</head>
<body>
<div id="root"></div>

<script type="module">
  import React, {useMemo, useState} from 'https://esm.sh/react@18.3.1';
  import {createRoot} from 'https://esm.sh/react-dom@18.3.1/client';

  const h = React.createElement;

  /**
   * Custom hook for making API calls, including authentication header.
   */
  function useApi(baseUrl, token, logMessage) {
    return useMemo(() => ({
      async call(path, {method = 'GET', body, headers = {}} = {}) {
        const resp = await fetch(`${baseUrl}${path}`, {
          method,
          headers: {
            'Content-Type': 'application/json',
            ...(token ? {'Authorization': `Bearer ${token}`} : {}),
            ...headers
          },
          body: body ? JSON.stringify(body) : undefined
        });
        const text = await resp.text();
        let parsed;
        try {
          // Attempt to parse JSON if text is not empty
          parsed = text ? JSON.parse(text) : null;
        } catch (_) {
          // Fallback to raw text if JSON parsing fails
          parsed = text;
        }
        if (!resp.ok) {
          // Throw an error with the response message or status
          throw new Error((parsed && parsed.message) || parsed || `Request failed with ${resp.status}`);
        }
        logMessage(`OK ${method} ${path}`);
        return parsed;
      }
    }), [baseUrl, token, logMessage]);
  }

  /**
   * The main application component.
   */
  const App = () => {
    const [status, setStatus] = useState('Ready');
    const [loginForm, setLoginForm] = useState({username: '', password: ''});
    const [token, setToken] = useState('');
    const [user, setUser] = useState(null); // State to store user profile data
    const [logoSrc, setLogoSrc] = useState('images/JobsHunterLogo.png');

    const logMessage = (msg) => setStatus(msg);
    const api = useApi('https://ronin-archesporial-lonnie.ngrok-free.dev', token, logMessage);

    // Effect hook to fetch user profile when the token is successfully set
    React.useEffect(() => {
      if (token) {
        logMessage('Fetching user profile...');
        api.call('/api/user/me')
          .then(data => {
            setUser(data);
            logMessage('User profile loaded successfully.');
          })
          .catch(err => {
            logMessage(`Profile fetch error: ${err.message}`);
            // Clear token if profile fetch fails (e.g., token expired)
            setToken('');
          });
      } else {
        // Clear user data when token is removed
        setUser(null);
      }
    }, [token, api]);

    const handleLogin = async (e) => {
      e.preventDefault();
      logMessage('Attempting login...');
      try {
        const res = await api.call('/api/auth/login', {method: 'POST', body: loginForm});
        setToken(res.token);
        logMessage('Login successful. Token acquired.');
      } catch (err) {
        setToken(''); // Ensure token is cleared on login failure
        logMessage(err.message);
      }
    };

    const handleLogout = () => {
      setToken('');
      setUser(null);
      setLoginForm({username: '', password: ''});
      logMessage('Logged out.');
    };

    // Helper component to display user profile information
    const FieldValue = ({value}) => {
      if (value === null || value === undefined) {
        return h('span', {className: 'text-muted'}, 'Not provided');
      }

      if (Array.isArray(value)) {
        if (value.length === 0) return h('span', {className: 'text-muted'}, '[]');
        return h('ul', {className: 'list-disc list-inside space-y-1'}, value.map((item, idx) =>
          h('li', {key: idx}, h(FieldValue, {value: item}))
        ));
      }

      if (typeof value === 'object') {
        return h('div', {className: 'nested-fields'}, Object.entries(value).map(([k, v]) =>
          h('div', {className: 'detail-row nested', key: k},
            h('span', {className: 'detail-key'}, k),
            h('div', {className: 'detail-value'}, h(FieldValue, {value: v}))
          )
        ));
      }

      return h('span', null, String(value));
    };

    const UserProfile = () => {
      if (!user) return null;

      const jsonString = JSON.stringify(user, null, 2);

      return h('section', {className: 'card profile-card'},
        h('h2', null, `Welcome, ${user.username || 'User'}!`),
        h('div', {className: 'profile-info'}, Object.entries(user).map(([key, value]) =>
          h('div', {className: 'detail-row', key},
            h('span', {className: 'detail-key'}, `${key}:`),
            h('div', {className: 'detail-value'}, h(FieldValue, {value}))
          )
        )),
        h('div', {className: 'json-card'},
          h('div', {className: 'json-card__header'},
            h('h3', null, 'Full API response'),
            h('span', {className: 'json-card__badge'}, 'Read-only')
          ),
          h('pre', {className: 'json-card__body'}, jsonString)
        ),
        h('button', {
          onClick: handleLogout,
          className: 'logout-button'
        }, 'Logout')
      );
    };

    // Helper component for the Login Form
    const LoginForm = () => (
      h('section', {className: 'card form-card'},
        h('h2', null, 'Login'), // Title changed to just 'Login'
        h('form', {className: 'form', onSubmit: handleLogin},
          h('label', {className: 'field'},
            h('span', null, 'Username'),
            h('input', {
              required: true,
              value: loginForm.username,
              onChange: (ev) => setLoginForm({...loginForm, username: ev.target.value})
            })
          ),
          h('label', {className: 'field'},
            h('span', null, 'Password'),
            h('input', {
              type: 'password',
              required: true,
              value: loginForm.password,
              onChange: (ev) => setLoginForm({...loginForm, password: ev.target.value})
            })
          ),
          h('button', {type: 'submit'}, 'Login')
        )
      )
    );

    return h('main', {className: 'page'},
      h('h1', {className: 'title'}, 'JobsHunter'),

      h('img', {
        src: logoSrc,
        alt: 'JobsHunter logo',
        className: 'logo',
        onError: () => setLogoSrc('images/JobsHunterLogo.svg')
      }),

      // Conditionally render the profile or the login form
      user ? h(UserProfile) : h(LoginForm),

      h('div', {className: 'status'}, h('strong', null, 'Status:'), ` ${status}`)
    );
  };

  const root = createRoot(document.getElementById('root'));
  root.render(h(App));
</script>
</body>
</html>
