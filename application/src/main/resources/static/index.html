<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JobsHunter UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    #root {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .title {
      font-size: 2.25rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 0;
    }

    .logo {
      max-width: 256px;
      width: 100%;
      height: auto;
      margin-bottom: 1rem;
      display: block;
    }

    .card {
      background-color: white;
      padding: 1.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
    }

    .form-card h2, .profile-card h2 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 1rem;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 0.5rem;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field span {
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 0.25rem;
    }

    input {
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    button {
      background-color: #4f46e5;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background-color: #4338ca;
    }

    button:active {
      transform: scale(0.99);
    }

    .status {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #6b7280;
      text-align: center;
    }

    .profile-card {
      text-align: left;
      border-left: 5px solid #10b981;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
    }

    .profile-grid div {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      padding: 0.75rem;
      word-break: break-word;
    }

    .profile-grid h3 {
      margin: 0 0 0.35rem 0;
      font-size: 0.95rem;
      color: #111827;
    }

    .profile-grid p {
      margin: 0;
      color: #4b5563;
      font-size: 0.9rem;
    }

    .code-block {
      background: #0b1021;
      color: #e5e7eb;
      border-radius: 0.75rem;
      padding: 1rem;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      overflow: auto;
      font-size: 0.9rem;
      border: 1px solid #1f2937;
    }

    .logout-button {
      background-color: #ef4444;
      width: 100%;
    }

    .logout-button:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="module">
  import React, {useMemo, useState} from 'https://esm.sh/react@18.3.1';
  import {createRoot} from 'https://esm.sh/react-dom@18.3.1/client';

  const h = React.createElement;

  function useApi(baseUrl, token, logMessage) {
    return useMemo(() => ({
      async call(path, {method = 'GET', body, headers = {}} = {}) {
        const resp = await fetch(`${baseUrl}${path}`, {
          method,
          headers: {
            'Content-Type': 'application/json',
            ...(token ? {'Authorization': `Bearer ${token}`} : {}),
            ...headers
          },
          body: body ? JSON.stringify(body) : undefined
        });

        const text = await resp.text();
        let parsed;
        try {
          parsed = text ? JSON.parse(text) : null;
        } catch (_) {
          parsed = text;
        }

        if (!resp.ok) {
          throw new Error((parsed && parsed.message) || parsed || `Request failed with ${resp.status}`);
        }

        logMessage(`OK ${method} ${path}`);
        return parsed;
      }
    }), [baseUrl, token, logMessage]);
  }

  const App = () => {
    const baseUrl = 'https://ronin-archesporial-lonnie.ngrok-free.dev';

    const [status, setStatus] = useState('Ready');
    const [loginForm, setLoginForm] = useState({username: '', password: ''});
    const [token, setToken] = useState('');
    const [user, setUser] = useState(null);

    // ✅ make logMessage stable (prevents api object churn)
    const logMessage = React.useCallback((msg) => setStatus(msg), []);

    const api = useApi(baseUrl, token, logMessage);

    // ✅ fetch profile only when token changes (no loop)
    React.useEffect(() => {
      if (!token) {
        setUser(null);
        return;
      }

      logMessage('Fetching user profile...');
      api.call('/api/user/me')
        .then(data => {
          setUser(data);
          logMessage('User profile loaded successfully.');
        })
        .catch(err => {
          logMessage(`Profile fetch error: ${err.message}`);
          setToken('');
        });
    }, [token]); // intentionally only token

    const handleLogin = async (e) => {
      e.preventDefault();
      logMessage('Attempting login...');
      try {
        const res = await api.call('/api/auth/login', {method: 'POST', body: loginForm});
        setToken(res.token);
        logMessage('Login successful. Token acquired.');
      } catch (err) {
        setToken('');
        logMessage(err.message);
      }
    };

    const handleLogout = () => {
      setToken('');
      setUser(null);
      setLoginForm({username: '', password: ''});
      logMessage('Logged out.');
    };

    const renderValue = (value) => {
      if (value === null || value === undefined) return '—';
      if (typeof value === 'object') return JSON.stringify(value);
      return String(value);
    };

    const renderEntries = (obj) => Object.entries(obj || {}).map(([key, value]) =>
      h('div', {key},
        h('h3', null, key),
        h('p', null, renderValue(value))
      )
    );

    const UserProfile = () => {
      if (!user) return null;

      return h('section', {className: 'card profile-card'},
        h('h2', null, `Welcome, ${user.username || 'User'}!`),
        h('div', {className: 'profile-grid'}, renderEntries(user)),
        h('div', null,
          h('h3', {className: 'mt-4 mb-2 text-gray-800 font-semibold'}, 'Full response'),
          h('pre', {className: 'code-block'}, JSON.stringify(user, null, 2))
        ),
        h('button', {
          onClick: handleLogout,
          className: 'logout-button'
        }, 'Logout')
      );
    };

    const LoginForm = () => (
      h('section', {className: 'card form-card'},
        h('h2', null, 'Login'),
        h('form', {className: 'form', onSubmit: handleLogin},
          h('label', {className: 'field'},
            h('span', null, 'Username'),
            h('input', {
              required: true,
              value: loginForm.username,
              onChange: (ev) => setLoginForm({...loginForm, username: ev.target.value})
            })
          ),
          h('label', {className: 'field'},
            h('span', null, 'Password'),
            h('input', {
              type: 'password',
              required: true,
              value: loginForm.password,
              onChange: (ev) => setLoginForm({...loginForm, password: ev.target.value})
            })
          ),
          h('button', {type: 'submit'}, 'Login')
        )
      )
    );

    return h('main', {className: 'page'},
      h('h1', {className: 'title'}, 'JobsHunter'),
      h('img', {src: 'images/JobsHunterLogo.png', alt: 'JobsHunter logo', className: 'logo'}),
      user ? h(UserProfile) : h(LoginForm),
      h('div', {className: 'status'}, h('strong', null, 'Status:'), ` ${status}`)
    );
  };

  const root = createRoot(document.getElementById('root'));
  root.render(h(App));
</script>
</body>
</html>
