# Avoid port conflicts during image build
server:
  port: 0
  ssl:
    enabled: false

spring:
  config:
    activate:
      on-profile: cds
  datasource:
    url: jdbc:h2:mem:cds;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
  mail:
    enabled: false
  main:
    banner-mode: off
    web-application-type: servlet
  threads:
    virtual:
      enabled: true

# Disable external integrations during CDS warmup
twilio:
  enabled: false

gemini:
  enabled: false

gpt:
  enabled: false

serpApi:
  enabled: false

logging:
  level:
    root: INFO
    com.jobshunter: INFO
