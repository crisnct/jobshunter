twilio:
  enabled: true
  account-sid: ${TWILIO_ACCOUNT_SID:notset}
  auth-token: ${TWILIO_AUTH_TOKEN:notset}
  from-number: ${TWILIO_WHATSAPP_FROM:notset}

gemini:
  enabled: true
  apiKey: ${GEMINI_API_KEY:notset}
  threads: 10

gpt:
  enabled: true
  apiKey: ${CHATGPT_API_KEY:notset}
  threads: 20

grok:
  enabled: true
  apiKey: ${GROK_API_KEY:notset}
  threads: 10

serp:
  enabled: true
  apiKey: ${SERP_API_KEY:notset}
  threads: 10
  maxPageSearch: 5

ipinfo:
  enabled: true
  apiKey: ${IPINFO_API_KEY:notset}
  threads: 1

spring:
  profiles:
    default: ${PROFILE:local}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:${MYSQL_URL:mysql://localhost:3306/jobshunter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:notset}
    password: ${MYSQL_PASSWORD:notset}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate.validator.message_interpolator: org.hibernate.validator.messageinterpolation.ParameterMessageInterpolator
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml
  main:
    banner-mode: off
    lazy-initialization: true
  mail:
    enabled: true
    host: send.smtp.mailtrap.io
    port: 587
    username: ${MAILTRAP_USERNAME:notset}
    password: ${MAILTRAP_PASSWORD:notset}
    from: ${MAIL_FROM:no-reply@mailtrap.io}
    apiKey: ${MAILTRAP_API_KEY:notset}
    templateUUID: ${MAILTRAP_TEMPLATE_NEWJOBS:notset}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.from: ${MAIL_FROM:no-reply@mailtrap.io}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:notset}
            client-secret: ${GOOGLE_CLIENT_SECRET:notset}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
    jwt:
      secret: ${JWT_SECRET:change-me-dev-secret-please-keep-long}
      expiration-sec: 3600 # 1h
    refresh-token:
      pepper: ${REFRESH_TOKEN_PEPPER:change-me-dev-secret-please-keep-long} # generate using openssl rand -base64 48
      expiration-sec: 2592000 # 30 days
    cookie:
      device-id:
        expiration-sec: 2592000 # 30 days
    cors:
      allowed-origins:
        - "https://ronin-archesporial-lonnie.ngrok-free.dev"
    httpsOnly:
      enabled: true

