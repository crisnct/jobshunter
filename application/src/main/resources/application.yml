server:
  port: 8081
  http2:
    enabled: true

jobshunter:
  name: JobsHunter
  expiredExpressions: was expired,is expired,no longer exists,This job was available,is no longer active,job is no longer available,this job was removed,Job not found,Applications from candidates outside of our global target markets are currently not accepted,No longer accepting applications,The job ad is no longer active,Application not possible,This job opening is no longer available,The vacancy has expired,this position has been filled,ONLY on W2,The job you are looking for is no longer open,Oferta no disponible,This job posting is no longer available,this job has expired,this position has been filled,This job offer is not active,Applications are closed
  iterationPerUser: 10
  iterationDelay: 30000
  scheduler:
    frequency: 3600000

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:notset}
  auth-token: ${TWILIO_AUTH_TOKEN:notset}
  from-number: ${TWILIO_WHATSAPP_FROM:notset}

chatGpt5:
  apiKey: ${CHATGPT_API_KEY:notset}
  model: "gpt-5.1"
  temperature: 0
  maxTokens: 1000
  toolsType: "web_search"
  systemPromptFile: "jobsSystemPromptGPT5.txt"

chatGpt4:
  apiKey: ${CHATGPT_API_KEY:notset}
  model: "gpt-4o-mini"
  temperature: 0
  maxTokens: 2000
  systemPromptFile: "jobsSystemPromptGPT4.txt"

serpApi:
  apiKey: ${SERP_API_KEY:notset}
  maxPageSearch: 3

spring:
  profiles:
    default: ${PROFILE:local}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:${MYSQL_URL:mysql://localhost:3306/jobshunter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:notset}
    password: ${MYSQL_PASSWORD:notset}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.validator.message_interpolator: org.hibernate.validator.messageinterpolation.ParameterMessageInterpolator
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${LIQUIBASE_ENABLED:true}
  mail:
    host: send.smtp.mailtrap.io
    port: 587
    username: ${MAILTRAP_USERNAME:notset}
    password: ${MAILTRAP_PASSWORD:notset}
    from: ${MAIL_FROM:no-reply@mailtrap.io}
    apiKey: ${MAILTRAP_API_KEY:notset}
    templateUUID: ${MAILTRAP_TEMPLATE_NEWJOBS:notset}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.from: ${MAIL_FROM:no-reply@mailtrap.io}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-secret-please-keep-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.jobshunter: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yml
    disable-swagger-default-url: true
