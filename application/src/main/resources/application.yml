# ACTUATOR & METRICS ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: jobshunter
    distribution:
      percentiles-histogram:
        ai.api: true
        job.hunt: true
      percentiles:
        ai.api: 0.5, 0.95, 0.99
        job.hunt: 0.5, 0.95, 0.99

# RATE LIMITER  ---------------------------------------------------------------------------
# Throttle API requests to 2 per minute, preventing quota violations and automatic request queueing
# with transparent permit management.
# limitForPeriod: 1                # Allow 1 call
# limitRefreshPeriod: 30s           # Every 30 seconds
# timeoutDuration: 5m              # Wait up to 5min for a slot

resilience4j.ratelimiter:
  instances:
    gptLimiter:
      limitForPeriod: 1
      limitRefreshPeriod: 1s
      timeoutDuration: 15m
      writableStackTraceEnabled: false
    grokLimiter:
      limitForPeriod: 1
      limitRefreshPeriod: 1s
      timeoutDuration: 15m
      writableStackTraceEnabled: false
    geminiLimiter:
      limitForPeriod: 1
      limitRefreshPeriod: 1s
      timeoutDuration: 15m
      writableStackTraceEnabled: false
    serpLimiter:
      limitForPeriod: 1
      limitRefreshPeriod: 20s
      timeoutDuration: 1m
      writableStackTraceEnabled: false
    twilioLimiter:
      limitForPeriod: 10
      limitRefreshPeriod: 1m
      timeoutDuration: 30s
      writableStackTraceEnabled: false
    tinyurlLimiter:
      limitForPeriod: 5
      limitRefreshPeriod: 1m
      timeoutDuration: 30s
      writableStackTraceEnabled: false
    mailtrapLimiter:
      limitForPeriod: 10
      limitRefreshPeriod: 1m
      timeoutDuration: 30s
      writableStackTraceEnabled: false
    ipinfoLimiter:
      limitForPeriod: 1
      limitRefreshPeriod: 1s
      timeoutDuration: 30s
      writableStackTraceEnabled: false

# CIRCUIT BREAKER ---------------------------------------------------------------------------
# Fault tolerance by monitoring API call failures.
# Automatically opens the circuit to prevent cascading failures when error threshold is exceeded,
# failing fast and allowing services to recover before retrying requests.

#registerHealthIndicator: expose a health indicator for this circuit breaker via actuator.
#slidingWindowType: use a COUNT_BASED window (by number of calls) for metrics.
#slidingWindowSize: track the last X calls in the sliding window.
#minimumNumberOfCalls: start calculating failure stats only after at least X calls.
#failureRateThreshold: open the breaker if the failure rate exceeds X %.
#slowCallRateThreshold: treat slow calls as a problem when more than X % are slow.
#slowCallDurationThreshold: any call slower than X sec is counted as “slow.”
#waitDurationInOpenState: keep the breaker open for X sec before trying again (half-open).
#permittedNumberOfCallsInHalfOpenState: allow that number of trial calls while half-open.
resilience4j.circuitbreaker:
  instances:
    gptCircuitBreaker:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      minimumNumberOfCalls: 3
      slidingWindowSize: 3

      failureRateThreshold: 100
      slowCallRateThreshold: 100
      slowCallDurationThreshold: 2m

      waitDurationInOpenState: 2m
      permittedNumberOfCallsInHalfOpenState: 1
    grokCircuitBreaker:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      minimumNumberOfCalls: 3
      slidingWindowSize: 3

      failureRateThreshold: 100
      slowCallRateThreshold: 100
      slowCallDurationThreshold: 2m

      waitDurationInOpenState: 2m
      permittedNumberOfCallsInHalfOpenState: 1
    geminiCircuitBreaker:
