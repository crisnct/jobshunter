server:
  port: ${SSL_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:classpath:jobshunter.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:jobshunter}
    enabled-protocols: TLSv1.3,TLSv1.2
    ciphers: >
      TLS_AES_256_GCM_SHA384,
      TLS_AES_128_GCM_SHA256
  servlet:
    session:
      cookie:
        secure: true
        http-only: false
  http2:
    enabled: true

jobshunter:
  name: JobsHunter
  expiredExpressions: was expired,is expired,no longer exists,This job was available,is no longer active,job is no longer available,this job was removed,Job not found,Applications from candidates outside of our global target markets are currently not accepted,No longer accepting applications,The job ad is no longer active,Application not possible,This job opening is no longer available,The vacancy has expired,this position has been filled,ONLY on W2,The job you are looking for is no longer open,Oferta no disponible,This job posting is no longer available,this job has expired,this position has been filled,This job offer is not active,Applications are closed,This job offer is not available
  blacklist: dailyremote.com,remote.co
  allowRedirection: true
  scheduler:
    frequency: 3600000
  ratelimit:
    capacity: 60
    window: 1m

twilio:
  enabled: true
  account-sid: ${TWILIO_ACCOUNT_SID:notset}
  auth-token: ${TWILIO_AUTH_TOKEN:notset}
  from-number: ${TWILIO_WHATSAPP_FROM:notset}

gemini:
  enabled: true
  apiKey: ${GEMINI_API_KEY:notset}
  maxTokens: 2000

gpt:
  enabled: true
  apiKey: ${CHATGPT_API_KEY:notset}
  maxTokens: 2000

serpApi:
  enabled: true
  apiKey: ${SERP_API_KEY:notset}
  maxPageSearch: 3

spring:
  profiles:
    default: ${PROFILE:local}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:${MYSQL_URL:mysql://localhost:3306/jobshunter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:notset}
    password: ${MYSQL_PASSWORD:notset}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate.validator.message_interpolator: org.hibernate.validator.messageinterpolation.ParameterMessageInterpolator
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml
  main:
    banner-mode: off
    lazy-initialization: true
  mail:
    enabled: true
    host: send.smtp.mailtrap.io
    port: 587
    username: ${MAILTRAP_USERNAME:notset}
    password: ${MAILTRAP_PASSWORD:notset}
    from: ${MAIL_FROM:no-reply@mailtrap.io}
    apiKey: ${MAILTRAP_API_KEY:notset}
    templateUUID: ${MAILTRAP_TEMPLATE_NEWJOBS:notset}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.from: ${MAIL_FROM:no-reply@mailtrap.io}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-secret-please-keep-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.jobshunter: DEBUG
    io.github.resilience4j.ratelimiter: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yml
    disable-swagger-default-url: true

# RATE LIMITER  ---------------------------------------------------------------------------
# Throttle API requests to 2 per minute, preventing quota violations and automatic request queueing
# with transparent permit management.

resilience4j.ratelimiter:
  instances:
    openaiLimiter:
      limitForPeriod: 1                # Allow 1 call
      limitRefreshPeriod: 30s           # Every 30 seconds
      timeoutDuration: 5m              # Wait up to 5min for a slot
      writableStackTraceEnabled: false
    geminiLimiter:
      limitForPeriod: 1                # Allow 1 call
      limitRefreshPeriod: 30           # Every 30 sec
      timeoutDuration: 5m              # Wait up to 5min for a slot
      writableStackTraceEnabled: false
    serpApiLimiter:
      limitForPeriod: 2                # Allow 2 calls
      limitRefreshPeriod: 1m           # Every 1 minute
      timeoutDuration: 1m             # Wait up to 1m for a slot
      writableStackTraceEnabled: false
    twilioLimiter:
      limitForPeriod: 10               # Allow 10 calls
      limitRefreshPeriod: 1m           # Every 1 minute
      timeoutDuration: 30s             # Wait up to 30s for a slot
      writableStackTraceEnabled: false
    tinyurlLimiter:
      limitForPeriod: 5                # Allow 5 calls
      limitRefreshPeriod: 1m           # Every 1 minute
      timeoutDuration: 30s             # Wait up to 30s for a slot
      writableStackTraceEnabled: false
    mailtrapLimiter:
      limitForPeriod: 10               # Allow 10 calls
      limitRefreshPeriod: 1m           # Every 1 minute
      timeoutDuration: 30s             # Wait up to 30s for a slot
      writableStackTraceEnabled: false

# TIME LIMITER ---------------------------------------------------------------------------
# Enforces maximum execution time for API calls by cancelling requests that exceed the configured timeout threshold,
# preventing indefinite hangs and ensuring predictable response times.

resilience4j.timelimiter:
  instances:
    browserSimulatorLimiter:
      timeoutDuration: 30s             # Timeout for browser page opening operations
      cancelRunningFuture: true        # Cancel the future if timeout occurs
      writableStackTraceEnabled: false

# CIRCUIT BREAKER ---------------------------------------------------------------------------
# Fault tolerance by monitoring API call failures.
# Automatically opens the circuit to prevent cascading failures when error threshold is exceeded,
# failing fast and allowing services to recover before retrying requests.

#registerHealthIndicator: expose a health indicator for this circuit breaker via actuator.
#slidingWindowType: use a COUNT_BASED window (by number of calls) for metrics.
#slidingWindowSize: track the last slidingWindowSize calls in the sliding window.
#minimumNumberOfCalls: start calculating failure stats only after at least minimumNumberOfCalls calls.
#failureRateThreshold: open the breaker if the failure rate exceeds failureRateThreshold %.
#slowCallRateThreshold: treat slow calls as a problem when more than slowCallRateThreshold % are slow.
#slowCallDurationThreshold: any call slower than slowCallDurationThreshold sec is counted as “slow.”
#waitDurationInOpenState: keep the breaker open for waitDurationInOpenState sec before trying again (half-open).
#permittedNumberOfCallsInHalfOpenState: allow that number of trial calls while half-open.
resilience4j.circuitbreaker:
  instances:
    geminiPremium:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 20
      minimumNumberOfCalls: 10
      failureRateThreshold: 50
      slowCallRateThreshold: 50
      slowCallDurationThreshold: 5s
      waitDurationInOpenState: 30s
      permittedNumberOfCallsInHalfOpenState: 3
    geminiEconomy:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 20
      minimumNumberOfCalls: 10
      failureRateThreshold: 50
      slowCallRateThreshold: 50
      slowCallDurationThreshold: 5s
      waitDurationInOpenState: 30s
      permittedNumberOfCallsInHalfOpenState: 3
