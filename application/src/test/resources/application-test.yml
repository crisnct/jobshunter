server:
  port: 8081

jobshunter:
  expiredExpressions: was expired,is expired,no longer exists,This job was available,is no longer active,job is no longer available,this job was removed,Job not found,Applications from candidates outside of our global target markets are currently not accepted,No longer accepting applications,The job ad is no longer active,Application not possible,This job opening is no longer available
  useDummyData: true
  iterationPerUser: 1
  iterationDelay: 30000
  scheduler:
    frequency: 3600000

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_WHATSAPP_FROM:}

gemini:
  apiKey: ${GEMINI_API_KEY:notset}
  delay: 10000

gpt:
  apiKey: ${CHATGPT_API_KEY:notset}
  maxTokens: 1000
  delay: 10000

serpApi:
  enabled: true
  apiKey: ${SERP_API_KEY:notset}
  maxPageSearch: 1
  delay: 10000

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/jobshunter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: false

security:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-secret-please-keep-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.jobshunter: DEBUG

resilience4j.circuitbreaker:
  instances:
    gptPremium:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 20
      minimumNumberOfCalls: 10
      failureRateThreshold: 50
      slowCallRateThreshold: 50
      slowCallDurationThreshold: 5s
      waitDurationInOpenState: 30s
      permittedNumberOfCallsInHalfOpenState: 3
    gptEconomy:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 20
      minimumNumberOfCalls: 10
      failureRateThreshold: 50
      slowCallRateThreshold: 50
      slowCallDurationThreshold: 5s
      waitDurationInOpenState: 30s
      permittedNumberOfCallsInHalfOpenState: 3
    serpApi:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 20
      minimumNumberOfCalls: 5
      failureRateThreshold: 50
      slowCallRateThreshold: 50
      slowCallDurationThreshold: 5s
      waitDurationInOpenState: 30s
      permittedNumberOfCallsInHalfOpenState: 3

resilience4j.bulkhead:
  instances:
    gptPremiumBulkhead:
      maxConcurrentCalls: 5
      maxWaitDuration: 2s
      writableStackTraceEnabled: false
    gptEconomyBulkhead:
      maxConcurrentCalls: 10
      maxWaitDuration: 2s
      writableStackTraceEnabled: false
    serpApiBulkhead:
      maxConcurrentCalls: 5
      maxWaitDuration: 2s
      writableStackTraceEnabled: false