events {
}

http {
    # Debug helpers for MCP auth token format (without logging full token value).
    map $http_authorization $mcp_has_bearer {
        default "false";
        "~^Bearer\s+.+$" "true";
    }

    map $http_authorization $mcp_token_jwt_like {
        default "false";
        "~^Bearer\s+[^.]+\.[^.]+\.[^.]+$" "true";
    }

    map $http_authorization $mcp_token_ya29_like {
        default "false";
        "~^Bearer\s+ya29\..+$" "true";
    }

    log_format mcp_auth_debug
        '$remote_addr - [$time_local] "$request" $status '
        'ua="$http_user_agent" '
        'route="$sent_http_x_routed_to" '
        'hasBearer=$mcp_has_bearer '
        'jwtLike=$mcp_token_jwt_like '
        'ya29Like=$mcp_token_ya29_like';

    server {
        listen 8080;

        # ==========================
        # MCP SERVER
        # ==========================

        # Route ALL MCP traffic through the MCP container:
        # - /mcp
        # - /mcp/
        # - /mcp/...
        location ^~ /mcp {
            proxy_pass http://jobshunter-mcp-server:8081;
            access_log /dev/stdout mcp_auth_debug;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header X-Routed-To mcp always;
        }

        # ==========================
        # MCP OAuth metadata
        # ==========================

        location ^~ /.well-known/oauth-protected-resource {
            proxy_pass http://jobshunter-mcp-server:8081;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Routed-To mcp-metadata always;
        }

        location ^~ /.well-known/oauth-authorization-server {
            proxy_pass http://jobshunter-mcp-server:8081;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Routed-To mcp-metadata always;
        }

        # OAuth paths potentially used by MCP clients during auth handshakes.
        # Route them to MCP so they do not fall through to the Jobshunter app.
        location ^~ /oauth2/ {
            proxy_pass http://jobshunter-mcp-server:8081;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Routed-To mcp-oauth always;
        }

        location ^~ /login/oauth2/ {
            proxy_pass http://jobshunter-mcp-server:8081;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Routed-To mcp-oauth always;
        }

        location = /authorize {
            proxy_pass http://jobshunter-mcp-server:8081/authorize;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header X-Routed-To mcp-oauth always;
        }

        location = /token {
            proxy_pass http://jobshunter-mcp-server:8081/token;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header X-Routed-To mcp-oauth always;
        }

        # ==========================
        # JOBSHUNTER
        # ==========================

        location / {
            proxy_pass https://JobsHunterContainer:8443;

            proxy_http_version 1.1;
            proxy_ssl_verify off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header X-Routed-To jobshunter always;
        }
    }
}